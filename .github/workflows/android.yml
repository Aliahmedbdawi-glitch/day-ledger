name: Android APK

# Builds a signed APK on every push to master (or on demand) and publishes it
# to the "android-latest" GitHub Release, so there is always one download link.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build web app and sync into Android
        run: npm run android:sync

      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret; see README (Android)."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/dayledger.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/dayledger.p12" >> "$GITHUB_ENV"

      - name: Build signed APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/DayLedger.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: DayLedger-apk
          path: ${{ runner.temp }}/DayLedger.apk

      - name: Publish to the android-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Day Ledger for Android (latest)
          body: |
            Build ${{ github.run_number }} from ${{ github.sha }}.
            Download **DayLedger.apk** on your phone and open it to install or update.
          files: ${{ runner.temp }}/DayLedger.apk
          make_latest: true
